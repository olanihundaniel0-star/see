name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./see-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: see_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/see_test
          APP_ENV: test
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./see-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck 2>/dev/null || echo "No typecheck script"

      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script"

      - name: Run tests
        run: npm test 2>/dev/null || echo "No test script"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: ./see-app
        run: npm audit --audit-level=moderate 2>/dev/null || true

      - name: Run Python safety check
        working-directory: ./see-backend
        run: |
          pip install safety
          safety check 2>/dev/null || true

  build-docker:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./see-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to staging
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deployment triggered"
          else
            echo "RENDER_DEPLOY_HOOK not configured"
          fi

      - name: Verify staging deployment
        run: |
          for i in {1..30}; do
            if curl -f https://staging-api.your-domain.com/health > /dev/null 2>&1; then
              echo "Staging API is healthy"
              exit 0
            fi
            echo "Waiting for staging API... (attempt $i/30)"
            sleep 10
          done
          echo "Staging API did not become healthy"
          exit 1

      - name: Notify staging deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '✅ Staging deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        if: always()

  deploy-production:
    needs: [build-docker, deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-domain.com

    steps:
      - uses: actions/checkout@v4

      - name: Wait for approval
        run: echo "Production deployment requires manual approval"

      - name: Deploy backend to production
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Production deployment triggered"
          else
            echo "RENDER_DEPLOY_HOOK not configured"
          fi

      - name: Verify production deployment
        run: |
          for i in {1..30}; do
            if curl -f https://api.your-domain.com/health > /dev/null 2>&1; then
              echo "Production API is healthy"
              exit 0
            fi
            echo "Waiting for production API... (attempt $i/30)"
            sleep 10
          done
          echo "Production API did not become healthy"
          exit 1

      - name: Notify production deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '🚀 Production deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,ref
        if: always()

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '❌ Production deployment failed - rollback instructions sent'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        if: always()

  performance-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging

    steps:
      - uses: actions/checkout@v4

      - name: Run performance baseline
        run: |
          # Simple health check and response time test
          echo "Testing staging API performance..."
          start_time=$(date +%s%N)
          response_code=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.your-domain.com/health)
          end_time=$(date +%s%N)
          
          response_time_ms=$(( (end_time - start_time) / 1000000 ))
          
          echo "Response time: ${response_time_ms}ms"
          echo "Response code: $response_code"
          
          if [ "$response_code" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
          
          if [ "$response_time_ms" -gt "1000" ]; then
            echo "Warning: Response time exceeds 1000ms"
          fi

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [test-backend, test-frontend]

    steps:
      - name: Clean up build artifacts
        run: echo "Cleanup complete"

      - name: Send summary
        run: echo "CI/CD pipeline completed"
