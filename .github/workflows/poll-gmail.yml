name: Poll Gmail

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail poll
        run: |
          backend_url="${{ secrets.BACKEND_URL }}"
          backend_url="${backend_url%/}"
          test -n "$backend_url"
          test -n "${{ secrets.INTERNAL_API_TOKEN }}"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -X POST "$backend_url/internal/poll-gmail" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_API_TOKEN }}"
