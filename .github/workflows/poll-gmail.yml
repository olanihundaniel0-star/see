name: Poll Gmail

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail poll
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -X POST "${{ secrets.BACKEND_URL }}/internal/poll-gmail" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_API_TOKEN }}"
