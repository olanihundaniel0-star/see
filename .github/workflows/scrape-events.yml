name: Scrape Events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger event scrape
        run: |
          backend_url="${{ secrets.BACKEND_URL }}"
          backend_url="${backend_url%/}"
          test -n "$backend_url"
          test -n "${{ secrets.INTERNAL_API_TOKEN }}"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 600 \
            -X POST "$backend_url/internal/scrape-events" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_API_TOKEN }}"
