services:
  - type: web
    name: see-backend
    runtime: docker
    plan: free
    rootDir: see-backend
    dockerfilePath: ./Dockerfile
    dockerCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: see-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: see-redis
          type: keyvalue
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: GMAIL_IMAP_TIMEOUT_SECONDS
        value: "20"
      - key: GMAIL_MAX_MESSAGES_PER_POLL
        value: "5"
      - key: GMAIL_POLL_INTERVAL_MINUTES
        value: "15"
      - key: EVENT_SCRAPE_INTERVAL_MINUTES
        value: "360"
      - key: EMAIL_WEBHOOK_TOLERANCE_SECONDS
        value: "900"
      - key: DEVPOST_HACKATHON_URL
        value: https://devpost.com/hackathons?challenge_type[]=online&sort_by=submission_deadline
      - key: LUMA_PAGE_URLS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Comma-separated origins allowed to call the API from a browser.
      # Native apps do not send an Origin header, so this only affects web builds.
      - key: CORS_ORIGINS
        sync: false
  - type: keyvalue
    name: see-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: see-postgres
    plan: free
