services:
  - type: web
    name: see-backend
    runtime: docker
    plan: free
    rootDir: see-backend
    dockerfilePath: ./Dockerfile
    dockerCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: see-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: see-redis
          type: keyvalue
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_POLL_INTERVAL_MINUTES
        value: "15"
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:19006
  - type: keyvalue
    name: see-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: see-postgres
    plan: free
